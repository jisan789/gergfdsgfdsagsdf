<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Force clear browser caches & service workers
    if ('caches' in window) {
      caches.keys().then(names => {
        for (let name of names) caches.delete(name);
      });
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let reg of registrations) reg.unregister();
      });
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ReelStream</title>
  <meta name="description" content="Minimalist Smooth Reel Video Player">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   ReelStream - Streamlined, Non-Scroll Video Player Design System
   ========================================================================== */

:root {
  --bg-page: #060709;
  --bg-stage: #000000;
  --bg-panel: #111217;
  --bg-input: #1a1b22;
  --bg-btn: rgba(22, 23, 29, 0.7);
  --bg-btn-hover: rgba(255, 255, 255, 0.2);

  --border-subtle: rgba(255, 255, 255, 0.12);
  --border-hover: rgba(255, 255, 255, 0.28);

  --accent-love: #ff2d55;
  --accent-green: #10b981;
  --accent-yellow: #f59e0b;

  --text-main: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.65);
  --text-faint: rgba(255, 255, 255, 0.38);

  --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --spring-ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-page);
  color: var(--text-main);
  font-family: var(--font-family);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* App Wrapper */
.player-app {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-page);
}

/* ==========================================================================
   Player Stage (Zero-Scroll, Fixed Screen)
   ========================================================================== */
.player-stage {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100%;
  background: var(--bg-stage);
  overflow: hidden;
  touch-action: pan-x;
}

@media (min-width: 640px) {
  .player-stage {
    height: 94vh;
    border-radius: 20px;
    border: 1px solid var(--border-subtle);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
  }
}

/* ==========================================================================
   Dual-Slot Reel Carousel Viewport (Zero-Flicker Native Transitions)
   ========================================================================== */
.video-carousel {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000000;
  z-index: 1;
}

.video-slot {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000000;
  will-change: transform, opacity, filter;
  transform: translate3d(0, 100%, 0);
  pointer-events: none;
  opacity: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.video-slot.active-slot {
  transform: translate3d(0, 0, 0);
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}

.video-slot.next-slot {
  transform: translate3d(0, 100%, 0);
  opacity: 1;
  z-index: 3;
}

.video-slot.prev-slot {
  transform: translate3d(0, -100%, 0);
  opacity: 1;
  z-index: 3;
}

/* Silky Smooth Native Spring Transitions */
.video-slot.is-animating {
  transition: transform 0.38s cubic-bezier(0.2, 0.95, 0.25, 1),
              opacity 0.38s cubic-bezier(0.2, 0.95, 0.25, 1),
              filter 0.38s cubic-bezier(0.2, 0.95, 0.25, 1);
}

.video-slot.slide-out-top {
  transform: translate3d(0, -100%, 0) scale(0.92) !important;
  opacity: 0.3 !important;
  filter: brightness(0.65) !important;
}

.video-slot.slide-out-bottom {
  transform: translate3d(0, 100%, 0) scale(0.92) !important;
  opacity: 0.3 !important;
  filter: brightness(0.65) !important;
}

.video-slot.slide-in-center {
  transform: translate3d(0, 0, 0) scale(1) !important;
  opacity: 1 !important;
  filter: brightness(1) !important;
}

/* Subtle elevation shadow on incoming slide */
.video-slot.has-depth-shadow {
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 20px 40px rgba(0, 0, 0, 0.9);
}

.reel-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  cursor: pointer;
  display: block;
}


/* Loading Spinner */
.stage-spinner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255, 255, 255, 0.15);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
}

@keyframes spin {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* Center Play/Pause Pop Indicator */
.center-indicator {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.65);
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.22s var(--spring-ease), opacity 0.2s ease;
}

.center-indicator.active {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* Double-Tap Heart Burst Animation */
.heart-burst {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  color: var(--accent-love);
  z-index: 15;
  pointer-events: none;
  filter: drop-shadow(0 0 14px rgba(255, 45, 85, 0.9));
}

.heart-burst.animate {
  animation: heartPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes heartPop {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  50% { transform: translate(-50%, -50%) scale(1.35); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.55) translateY(-25px); opacity: 0; }
}

/* ==========================================================================
   Header Bar
   ========================================================================== */
.stage-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  z-index: 30;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
  pointer-events: none;
}

.stage-logo {
  font-size: 0.98rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
  pointer-events: auto;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
}

/* Audio Mute / Unmute Toggle Button (Luxury Frosted Pill) */
.audio-toggle-btn {
  position: relative;
  z-index: 50;
  pointer-events: auto !important;
  touch-action: manipulation;
  height: 34px;
  padding: 0 11px 0 9px;
  border-radius: 9999px;
  background: rgba(18, 20, 26, 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
              background 0.2s ease,
              border-color 0.2s ease,
              box-shadow 0.2s ease,
              color 0.2s ease;
  font-family: inherit;
  user-select: none;
  -webkit-user-select: none;
}

.audio-toggle-btn * {
  pointer-events: none;
}

.audio-toggle-btn:hover {
  transform: scale(1.05);
  background: rgba(28, 32, 42, 0.85);
  border-color: rgba(255, 255, 255, 0.3);
}

.audio-toggle-btn:active {
  transform: scale(0.93);
}

.audio-toggle-btn.is-muted {
  background: rgba(20, 22, 28, 0.75);
  border-color: rgba(255, 255, 255, 0.14);
  color: rgba(255, 255, 255, 0.72);
}

.audio-toggle-btn.is-unmuted {
  background: rgba(16, 185, 129, 0.18);
  border-color: rgba(16, 185, 129, 0.55);
  color: #a7f3d0;
  box-shadow: 0 0 16px rgba(16, 185, 129, 0.28);
}

.audio-icon-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
}

.audio-label {
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

/* Sound Wave Bars Animation */
.sound-wave-bars {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 12px;
}

.sound-wave-bars .bar {
  width: 2px;
  height: 100%;
  background: currentColor;
  border-radius: 1px;
  opacity: 0.3;
  transform: scaleY(0.3);
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.audio-toggle-btn.is-unmuted .sound-wave-bars .bar {
  opacity: 1;
  animation: soundWave 0.9s ease-in-out infinite alternate;
}

.audio-toggle-btn.is-unmuted .sound-wave-bars .bar:nth-child(1) {
  animation-delay: 0s;
  height: 60%;
}
.audio-toggle-btn.is-unmuted .sound-wave-bars .bar:nth-child(2) {
  animation-delay: 0.25s;
  height: 100%;
}
.audio-toggle-btn.is-unmuted .sound-wave-bars .bar:nth-child(3) {
  animation-delay: 0.45s;
  height: 75%;
}

@keyframes soundWave {
  0% { transform: scaleY(0.35); }
  100% { transform: scaleY(1); }
}

/* ==========================================================================
   Right Action Sidebar (Love & Comment only)
   ========================================================================== */
.action-sidebar {
  position: absolute;
  right: 14px;
  bottom: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  z-index: 30;
}

.circle-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--bg-btn);
  border: 1px solid var(--border-subtle);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.circle-btn:hover {
  background: var(--bg-btn-hover);
  border-color: var(--border-hover);
  transform: scale(1.08);
}

.circle-btn:active {
  transform: scale(0.92);
}

.action-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.circle-btn.loved {
  color: var(--accent-love);
  background: rgba(255, 45, 85, 0.18);
  border-color: rgba(255, 45, 85, 0.5);
}

.action-num {
  font-size: 0.7rem;
  font-weight: 600;
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

#btnSendInbox:hover {
  color: #60a5fa;
  border-color: rgba(96, 165, 250, 0.4);
}

#btnSendInbox:active {
  color: #3b82f6;
  background: rgba(59, 130, 246, 0.2);
  border-color: rgba(59, 130, 246, 0.6);
  transform: scale(0.92);
}

/* ==========================================================================
   Scrubber Bar
   ========================================================================== */
.stage-scrubber {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 12px;
  display: flex;
  align-items: flex-end;
  cursor: pointer;
  z-index: 40;
}

.scrubber-track {
  width: 100%;
  height: 2.5px;
  background: rgba(255, 255, 255, 0.2);
  transition: height 0.15s ease;
}

.stage-scrubber:hover .scrubber-track {
  height: 5px;
}

.scrubber-fill {
  height: 100%;
  width: 0%;
  background: #ffffff;
}

/* ==========================================================================
   Toast Notification
   ========================================================================== */
.toast-popup {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-8px);
  background: rgba(18, 18, 22, 0.95);
  border: 1px solid var(--border-subtle);
  color: #ffffff;
  padding: 7px 16px;
  border-radius: 9999px;
  font-size: 0.8rem;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 200;
}

.toast-popup.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ==========================================================================
   Story Reminder Modal (Shown on start)
   ========================================================================== */
.story-reminder-overlay {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: rgba(6, 7, 9, 0.92);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  z-index: 10002;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 1;
  visibility: visible;
  transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}

.story-reminder-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.story-reminder-card {
  max-width: 380px;
  width: 100%;
  background: rgba(18, 19, 26, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 24px;
  padding: 32px 24px 26px;
  text-align: center;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(59, 130, 246, 0.22);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  animation: reminderCardPop 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes reminderCardPop {
  from {
    opacity: 0;
    transform: scale(0.92) translateY(12px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.story-reminder-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(147, 51, 234, 0.15));
  border: 2px solid rgba(96, 165, 250, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  box-shadow: 0 0 26px rgba(59, 130, 246, 0.35);
}

.story-reminder-title {
  font-size: 1.35rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.02em;
}

.story-reminder-question {
  font-size: 1.05rem;
  color: rgba(255, 255, 255, 0.9);
  line-height: 1.45;
  font-weight: 500;
}

.story-reminder-url-box {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 4px 0 6px;
  box-sizing: border-box;
}

.story-url-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.5);
  font-weight: 600;
}

.story-url-link {
  font-size: 0.92rem;
  color: #60a5fa;
  text-decoration: none;
  font-weight: 600;
  word-break: break-all;
  transition: color 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.story-url-link:hover {
  color: #93c5fd;
  text-decoration: underline;
}

.story-reminder-actions {
  display: flex;
  gap: 12px;
  width: 100%;
}

.story-btn {
  flex: 1;
  padding: 13px 18px;
  border-radius: 14px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  user-select: none;
  box-sizing: border-box;
}

.story-btn-yes {
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 4px 18px rgba(37, 99, 235, 0.4);
}

.story-btn-yes:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 22px rgba(37, 99, 235, 0.55);
  filter: brightness(1.1);
}

.story-btn-no {
  background: rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.story-btn-no:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
  transform: translateY(-2px);
}

.story-btn:active {
  transform: translateY(0);
}

/* ==========================================================================
   Reels Section - Story Integration (Easy Interactive Buttons)
   ========================================================================== */
.stage-story-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 18px;
  background: rgba(37, 99, 235, 0.28);
  border: 1px solid rgba(96, 165, 250, 0.55);
  color: #bfdbfe;
  text-decoration: none;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  pointer-events: auto;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 2px 10px rgba(37, 99, 235, 0.28);
}

.stage-story-chip:hover {
  background: rgba(37, 99, 235, 0.52);
  border-color: #93c5fd;
  color: #ffffff;
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
}

.stage-story-chip:active {
  transform: translateY(0) scale(0.98);
}

.story-chip-icon {
  font-size: 0.95rem;
  line-height: 1;
}

.story-circle-btn {
  text-decoration: none;
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.35) 0%, rgba(30, 64, 175, 0.3) 100%);
  border: 1.5px solid rgba(96, 165, 250, 0.6);
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
}

.story-circle-btn:hover {
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.65) 0%, rgba(30, 64, 175, 0.6) 100%);
  border-color: #93c5fd;
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.55);
  transform: scale(1.1);
}

.story-circle-btn:active {
  transform: scale(0.92);
}

.story-circle-icon {
  font-size: 1.35rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
}

/* ==========================================================================
   18+ Age Warning Modal (Shown on every reload)
   ========================================================================== */
.age-warning-overlay {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: rgba(6, 7, 9, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 1;
  visibility: visible;
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.age-warning-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.age-warning-card {
  max-width: 360px;
  width: 100%;
  background: rgba(18, 19, 26, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  padding: 34px 24px 28px;
  text-align: center;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(255, 45, 85, 0.18);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  animation: warningCardPop 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes warningCardPop {
  from {
    opacity: 0;
    transform: scale(0.92) translateY(12px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.age-warning-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 66px;
  height: 66px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 45, 85, 0.22), rgba(255, 45, 85, 0.08));
  border: 2px solid rgba(255, 45, 85, 0.6);
  color: #ff2d55;
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  box-shadow: 0 0 26px rgba(255, 45, 85, 0.35);
}

.age-warning-title {
  font-size: 1.35rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.02em;
}

.age-warning-text {
  font-size: 0.96rem;
  color: rgba(255, 255, 255, 0.85);
  line-height: 1.5;
  margin-bottom: 6px;
}

.age-warning-actions {
  display: flex;
  gap: 12px;
  width: 100%;
}

.age-btn {
  flex: 1;
  padding: 13px 18px;
  border-radius: 14px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}

.age-btn-yes {
  background: linear-gradient(135deg, #ff2d55 0%, #e02447 100%);
  color: #ffffff;
  box-shadow: 0 4px 18px rgba(255, 45, 85, 0.35);
}

.age-btn-yes:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 22px rgba(255, 45, 85, 0.5);
  filter: brightness(1.08);
}

.age-btn-no {
  background: rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.age-btn-no:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
  transform: translateY(-2px);
}

.age-btn:active {
  transform: translateY(0);
}


/* ==========================================================================
   Scroll Down Instruction Hint
   ========================================================================== */

.scroll-hint {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 90;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.scroll-hint.visible {
  opacity: 1;
}

.scroll-hint.fade-out {
  opacity: 0;
}

.scroll-hint-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255, 255, 255, 0.85);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.3px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
}

.scroll-hint-arrow {
  animation: scrollBounce 1.5s ease-in-out infinite;
  filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.5));
}

@keyframes scrollBounce {
  0%, 100% {
    transform: translateY(0);
    opacity: 0.6;
  }
  50% {
    transform: translateY(8px);
    opacity: 1;
  }
}
  </style>
</head>
<body>
  <!-- 18+ Age Warning Modal (Appears on every reload) -->
  <div class="age-warning-overlay" id="ageWarningModal">
    <div class="age-warning-card">
      <div class="age-warning-badge">18+</div>
      <h2 class="age-warning-title">Warning</h2>
      <p class="age-warning-text">This is for 18+ person only</p>
      <div class="age-warning-actions">
        <button type="button" class="age-btn age-btn-yes" id="btnAgeYes">Yes</button>
        <button type="button" class="age-btn age-btn-no" id="btnAgeNo">No</button>
      </div>
    </div>
  </div>

  <div class="player-app" id="playerApp">
    <!-- Main Player Stage (Fixed, Finger Swipe Enabled) -->
    <div class="player-stage" id="playerStage">
      <!-- Dual-Slot Smooth Reel Carousel Viewport -->
      <div class="video-carousel" id="videoCarousel">
        <div class="video-slot active-slot" id="slotA">
          <video id="videoA" class="reel-video" loop playsinline></video>
        </div>
        <div class="video-slot next-slot" id="slotB">
          <video id="videoB" class="reel-video" loop playsinline></video>
        </div>
      </div>

      <!-- Center Play/Pause Pop Indicator -->
      <div class="center-indicator" id="centerIndicator">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>

      <!-- Heart Burst (Double Tap Love) -->
      <div class="heart-burst" id="heartBurst">
        <svg viewBox="0 0 24 24" width="76" height="76" fill="currentColor">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      </div>

      <!-- Video Buffering Spinner -->
      <div class="stage-spinner" id="stageSpinner"></div>

      <!-- Scroll Instruction Hint -->
      <div class="scroll-hint" id="scrollHint">
        <div class="scroll-hint-content">
          <svg class="scroll-hint-arrow" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <polyline points="19 12 12 19 5 12"></polyline>
          </svg>
          <span>Scroll down for next reels</span>
        </div>
      </div>

      <!-- Minimalist Top Bar -->
      <header class="stage-header">
        <div class="header-left">
          <span class="stage-logo">ReelStream</span>
          <!-- Easy Story Interaction Button -->
          <a href="https://sstory-beige.vercel.app/" target="_blank" rel="noopener noreferrer" class="stage-story-chip" id="btnHeaderStory" title="Read Stories">
            <span class="story-chip-icon">📖</span>
            <span class="story-chip-label">Read Story</span>
          </a>
        </div>

        <div class="header-right">
          <!-- Audio Toggle (Mute / Unmute) -->
          <button class="audio-toggle-btn is-muted" id="btnAudioToggle" title="Sound (M)" type="button">
            <span class="audio-icon-wrap" id="audioIcon">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </span>
            <span class="audio-label" id="audioLabel">Muted</span>
            <span class="sound-wave-bars">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </span>
          </button>
        </div>
      </header>

      <!-- Right Action Sidebar (Love & Story Navigation) -->
      <aside class="action-sidebar">
        <!-- Love React -->
        <div class="action-wrap">
          <button class="circle-btn" id="btnLove" title="Love React (L)">
            <svg id="loveIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
          <span class="action-num" id="loveCount">0</span>
        </div>

        <!-- Story Action Button -->
        <div class="action-wrap">
          <a href="https://sstory-beige.vercel.app/" target="_blank" rel="noopener noreferrer" class="circle-btn story-circle-btn" id="btnSidebarStory" title="Read Stories">
            <span class="story-circle-icon">📖</span>
          </a>
          <span class="action-num">Story</span>
        </div>
      </aside>

      <!-- Scrubber Progress Bar -->
      <div class="stage-scrubber" id="scrubberBar">
        <div class="scrubber-track">
          <div class="scrubber-fill" id="scrubberFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Popup -->
  <div class="toast-popup" id="toastPopup"></div>

  <script>
// ==========================================================================
// ReelStream - Ultra-Smooth Native Dual-Slot Video Player
// ==========================================================================

let allUrls = [];
const history = [];
let historyPointer = -1;
let nextPreloadedReel = null;
let isMuted = true;
let isTransitioning = false;
let isAutoSkipping = false;
let lastSkipTime = 0;
let currentReelStartTime = null;

// Local Favorites & Likes Storage
const currentLikesStorageKey = 'reelstream_likes';
let myLikedIds = new Set(JSON.parse(localStorage.getItem(currentLikesStorageKey) || '[]'));

// DOM Elements
const storyReminderModal = document.getElementById('storyReminderModal');
const btnStoryYes = document.getElementById('btnStoryYes');
const btnStoryNo = document.getElementById('btnStoryNo');
const storyUrlLink = document.getElementById('storyUrlLink');

const ageWarningModal = document.getElementById('ageWarningModal');
const btnAgeYes = document.getElementById('btnAgeYes');
const btnAgeNo = document.getElementById('btnAgeNo');

const playerStage = document.getElementById('playerStage');
const videoCarousel = document.getElementById('videoCarousel');
const slotA = document.getElementById('slotA');
const slotB = document.getElementById('slotB');
const videoA = document.getElementById('videoA');
const videoB = document.getElementById('videoB');

const stageSpinner = document.getElementById('stageSpinner');
const centerIndicator = document.getElementById('centerIndicator');
const heartBurst = document.getElementById('heartBurst');
const btnAudioToggle = document.getElementById('btnAudioToggle');
const audioIcon = document.getElementById('audioIcon');
const audioLabel = document.getElementById('audioLabel');

const btnLove = document.getElementById('btnLove');
const loveIcon = document.getElementById('loveIcon');
const loveCount = document.getElementById('loveCount');
const scrubberBar = document.getElementById('scrubberBar');
const scrubberFill = document.getElementById('scrubberFill');
const toastPopup = document.getElementById('toastPopup');
const scrollHint = document.getElementById('scrollHint');

// Dual-Slot State: 0 -> slotA is active, 1 -> slotB is active
let activeSlotIndex = 0;

function getActiveSlot() {
  return activeSlotIndex === 0 ? slotA : slotB;
}

function getInactiveSlot() {
  return activeSlotIndex === 0 ? slotB : slotA;
}

function getActiveVideo() {
  return activeSlotIndex === 0 ? videoA : videoB;
}

function getInactiveVideo() {
  return activeSlotIndex === 0 ? videoB : videoA;
}

let hasUserInteractedWithStoryReminder = false;
let hasUserInteractedWithAgeModal = false;
let isStoryReminderShown = false;
let pendingFirstReel = null;

function isStoryReminderActive() {
  return false;
}

function isAgeModalActive() {
  if (hasUserInteractedWithAgeModal) return false;
  return ageWarningModal && !ageWarningModal.classList.contains('hidden') && ageWarningModal.style.display !== 'none';
}

function isAnyModalActive() {
  return isAgeModalActive();
}

// Show Story Reminder (Disabled: removed from starting flow)
function showStoryReminder() {
  // No-op
}

// Story Reminder Modal Handler
function dismissStoryReminder() {
  hasUserInteractedWithStoryReminder = true;
  isStoryReminderShown = false;
  if (!storyReminderModal) return;
  storyReminderModal.classList.add('hidden');
  setTimeout(() => {
    storyReminderModal.style.display = 'none';
  }, 320);

  // Both modals are concluded: start video playback and show hint
  currentReelStartTime = Date.now();
  showScrollHint();
  if (pendingFirstReel) {
    const reel = pendingFirstReel;
    pendingFirstReel = null;
    playReel(reel, null);
  } else {
    const activeVid = getActiveVideo();
    if (activeVid) {
      const playPromise = activeVid.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn('Playback error after modal interaction:', err);
        });
      }
      centerIndicator.classList.remove('active');
    }
  }
}

if (btnStoryYes) {
  btnStoryYes.addEventListener('click', () => {
    sendStoryChoiceAlert('Yes (Going to Story) 📖');
    dismissStoryReminder();
  });
}

if (storyUrlLink) {
  storyUrlLink.addEventListener('click', () => {
    sendStoryChoiceAlert('Clicked Story Link 🔗');
    dismissStoryReminder();
  });
}

if (btnStoryNo) {
  btnStoryNo.addEventListener('click', (e) => {
    e.stopPropagation();
    sendStoryChoiceAlert('No (Stayed on Reels) 🎬');
    dismissStoryReminder();
  });
}

// 18+ Warning Modal Handler (Shown on reload; dismisses directly into Reels)
function dismissAgeWarning(choice) {
  hasUserInteractedWithAgeModal = true;
  if (choice) {
    sendAgeChoiceAlert(choice);
  }
  if (ageWarningModal) {
    ageWarningModal.classList.add('hidden');
    setTimeout(() => {
      ageWarningModal.style.display = 'none';
    }, 320);
  }

  // Start video playback and show hint immediately without story reminder
  currentReelStartTime = Date.now();
  showScrollHint();
  if (pendingFirstReel) {
    const reel = pendingFirstReel;
    pendingFirstReel = null;
    playReel(reel, null);
  } else {
    const activeVid = getActiveVideo();
    if (activeVid) {
      const playPromise = activeVid.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn('Playback error after age warning:', err);
        });
      }
      centerIndicator.classList.remove('active');
    }
  }
}

if (btnAgeYes) {
  btnAgeYes.addEventListener('click', (e) => {
    e.stopPropagation();
    dismissAgeWarning('Yes ✅');
  });
}

if (btnAgeNo) {
  btnAgeNo.addEventListener('click', (e) => {
    e.stopPropagation();
    dismissAgeWarning('No ❌');
  });
}

// Reels Section - Quick Interactive Story Buttons
const btnHeaderStory = document.getElementById('btnHeaderStory');
const btnSidebarStory = document.getElementById('btnSidebarStory');

if (btnHeaderStory) {
  btnHeaderStory.addEventListener('click', () => {
    sendStoryChoiceAlert('Clicked Header Story Button 📖');
  });
}

if (btnSidebarStory) {
  btnSidebarStory.addEventListener('click', (e) => {
    e.stopPropagation();
    sendStoryChoiceAlert('Clicked Sidebar Story Button 📖');
  });
}


// Scroll Instruction Hint
function showScrollHint() {
  if (!scrollHint) return;
  scrollHint.classList.add('visible');
  setTimeout(() => {
    scrollHint.classList.add('fade-out');
    scrollHint.classList.remove('visible');
  }, 4000);
}

// Toast Notification
function showToast(msg) {
  toastPopup.textContent = msg;
  toastPopup.classList.add('show');
  setTimeout(() => {
    toastPopup.classList.remove('show');
  }, 2200);
}

// Random Reel Picker
function pickRandomReel() {
  if (allUrls.length === 0) return null;
  const randomIndex = Math.floor(Math.random() * allUrls.length);
  return {
    id: randomIndex + 1,
    url: allUrls[randomIndex]
  };
}

// Background Preload into Inactive Slot
function prepareNextPreload() {
  nextPreloadedReel = pickRandomReel();
  if (nextPreloadedReel) {
    const inactiveVid = getInactiveVideo();
    if (inactiveVid.src !== nextPreloadedReel.url) {
      inactiveVid.src = nextPreloadedReel.url;
      inactiveVid.muted = true;
      inactiveVid.preload = 'auto';
      inactiveVid.load();
    }
  }
}

// Video Playback Error Handler (Throttled & ignores normal aborts)
function handleVideoError(vid, context = 'error') {
  if (vid !== getActiveVideo()) return;
  const err = vid.error;
  // Ignore normal MEDIA_ERR_ABORTED (code 1) when switching videos
  if (err && err.code === 1) return;

  const now = Date.now();
  if (now - lastSkipTime < 2000) return; // Prevent fast loops
  lastSkipTime = now;

  console.warn(`Video playback issue (${context}). Auto-skipping...`);
  showToast('Skipping unavailable reel... ⏭️');

  if (isAutoSkipping) return;
  isAutoSkipping = true;

  setTimeout(() => {
    isAutoSkipping = false;
    goNext();
  }, 500);
}

// Play / Transition Reel with Silky Native Dual-Slot Animation
function playReel(reel, direction = null) {
  if (!reel) {
    goNext();
    return;
  }

  // Prevent view notification and video playback before user dismisses reminder/age modals
  if (isAnyModalActive()) {
    pendingFirstReel = reel;
    return;
  }

  // Notify video view
  sendVideoViewAlert(reel);

  stageSpinner.style.opacity = '1';

  // Initial load without slide transition
  if (!direction) {
    const activeSlot = getActiveSlot();
    const activeVid = getActiveVideo();

    activeSlot.className = 'video-slot active-slot';
    activeSlot.style.transform = '';
    activeSlot.style.opacity = '1';
    activeSlot.style.filter = '';

    activeVid.src = reel.url;
    activeVid.muted = isMuted;

    const playPromise = activeVid.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        stageSpinner.style.opacity = '0';
      }).catch((err) => {
        stageSpinner.style.opacity = '0';
        if (err && err.name === 'NotAllowedError') {
          centerIndicator.classList.add('active');
        }
      });
    }

    centerIndicator.classList.remove('active');
    updateSideRailUI(reel);
    prepareNextPreload();
    return;
  }

  if (isTransitioning) return;
  isTransitioning = true;

  const currSlot = getActiveSlot();
  const incomingSlot = getInactiveSlot();
  const currVideo = getActiveVideo();
  const incomingVideo = getInactiveVideo();

  // Ensure target URL is assigned to incoming video
  if (incomingVideo.src !== reel.url) {
    incomingVideo.src = reel.url;
  }
  incomingVideo.muted = isMuted;
  incomingVideo.currentTime = 0;

  // Reset classes and inline styles before starting animation
  incomingSlot.classList.remove('is-animating', 'slide-in-center', 'slide-out-top', 'slide-out-bottom');
  currSlot.classList.remove('is-animating', 'slide-in-center', 'slide-out-top', 'slide-out-bottom');

  incomingSlot.style.transition = 'none';
  currSlot.style.transition = 'none';
  incomingSlot.style.opacity = '1';
  incomingSlot.style.filter = 'brightness(1)';
  currSlot.style.filter = 'brightness(1)';

  if (direction === 'next') {
    incomingSlot.style.transform = 'translate3d(0, 100%, 0)';
  } else {
    incomingSlot.style.transform = 'translate3d(0, -100%, 0)';
  }
  incomingSlot.classList.add('has-depth-shadow');

  // Force reflow to commit initial positions
  void incomingSlot.offsetWidth;

  // Start incoming video playback immediately
  const playPromise = incomingVideo.play();
  if (playPromise !== undefined) {
    playPromise.then(() => {
      stageSpinner.style.opacity = '0';
    }).catch((err) => {
      stageSpinner.style.opacity = '0';
      if (err && err.name === 'NotAllowedError') {
        centerIndicator.classList.add('active');
      }
    });
  }

  // Apply silky spring transition
  incomingSlot.classList.add('is-animating');
  currSlot.classList.add('is-animating');

  if (direction === 'next') {
    currSlot.classList.add('slide-out-top');
    incomingSlot.classList.add('slide-in-center');
  } else {
    currSlot.classList.add('slide-out-bottom');
    incomingSlot.classList.add('slide-in-center');
  }

  // Animation completion
  setTimeout(() => {
    currVideo.pause();

    // Clean up slots
    currSlot.className = 'video-slot';
    currSlot.style.transform = '';
    currSlot.style.opacity = '0';
    currSlot.style.filter = '';
    currSlot.classList.remove('has-depth-shadow', 'is-animating', 'slide-out-top', 'slide-out-bottom');

    incomingSlot.className = 'video-slot active-slot';
    incomingSlot.style.transform = '';
    incomingSlot.style.opacity = '1';
    incomingSlot.style.filter = '';
    incomingSlot.classList.remove('has-depth-shadow', 'is-animating', 'slide-in-center');

    // Swap active slot pointer
    activeSlotIndex = 1 - activeSlotIndex;
    isTransitioning = false;

    centerIndicator.classList.remove('active');
    updateSideRailUI(reel);

    // Buffer the next reel into the now-inactive slot
    prepareNextPreload();
  }, 390);
}

// Update Side Rail Controls
function updateSideRailUI(reel) {
  if (!reel) return;
  const isLovedByMe = myLikedIds.has(reel.id);

  if (isLovedByMe) {
    btnLove.classList.add('loved');
    loveIcon.setAttribute('fill', 'currentColor');
  } else {
    btnLove.classList.remove('loved');
    loveIcon.setAttribute('fill', 'none');
  }

  loveCount.textContent = isLovedByMe ? 1 : 0;
}

// Navigate Next (Random + Preloaded)
function goNext() {
  if (isAnyModalActive() || isTransitioning) return;
  if (historyPointer < history.length - 1) {
    historyPointer++;
    const reel = history[historyPointer];
    playReel(reel, 'next');
  } else {
    const reel = nextPreloadedReel || pickRandomReel();
    history.push(reel);
    historyPointer = history.length - 1;
    playReel(reel, 'next');
  }
}

// Navigate Previous
function goPrevious() {
  if (isAnyModalActive() || isTransitioning) return;
  if (historyPointer > 0) {
    historyPointer--;
    const reel = history[historyPointer];
    playReel(reel, 'prev');
  } else {
    showToast('First reel in session');
  }
}

// Love React Toggle
function toggleLove() {
  if (isAnyModalActive() || historyPointer < 0 || !history[historyPointer]) return;
  const currentReel = history[historyPointer];
  const isLoved = myLikedIds.has(currentReel.id);

  if (isLoved) {
    myLikedIds.delete(currentReel.id);
  } else {
    myLikedIds.add(currentReel.id);
    heartBurst.classList.remove('animate');
    void heartBurst.offsetWidth;
    heartBurst.classList.add('animate');

    // Notify love react
    sendLoveAlert(currentReel);
  }

  localStorage.setItem(currentLikesStorageKey, JSON.stringify([...myLikedIds]));
  updateSideRailUI(currentReel);
}

// Tap on Video for Play / Pause & Double-Tap for Love
let lastTap = 0;
videoCarousel.addEventListener('click', (e) => {
  if (isAnyModalActive()) return;
  // If clicked on controls, ignore
  if (e.target.closest('.action-sidebar') || e.target.closest('.stage-header') || e.target.closest('.stage-scrubber')) {
    return;
  }

  const now = Date.now();
  if (now - lastTap < 300) {
    toggleLove();
    lastTap = 0;
  } else {
    lastTap = now;
    setTimeout(() => {
      if (lastTap === now) {
        const vid = getActiveVideo();
        if (vid.paused) {
          vid.play();
          centerIndicator.classList.remove('active');
        } else {
          vid.pause();
          centerIndicator.classList.add('active');
        }
      }
    }, 305);
  }
});

btnLove.addEventListener('click', toggleLove);

// ==========================================================================
// Interactive Touch Gestures (Drag-to-follow physics)
// ==========================================================================
let touchStartY = 0;
let touchStartX = 0;
let touchStartTime = 0;
let isDraggingTouch = false;

playerStage.addEventListener('touchstart', (e) => {
  if (isAnyModalActive()) return;
  if (e.target.closest('.stage-header') || e.target.closest('.action-sidebar') || e.target.closest('.stage-scrubber')) {
    return;
  }
  if (isTransitioning) return;
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
  touchStartTime = Date.now();
  isDraggingTouch = false;
}, { passive: true });

playerStage.addEventListener('touchmove', (e) => {
  if (isAnyModalActive() || isTransitioning) return;
  const currentY = e.touches[0].clientY;
  const currentX = e.touches[0].clientX;
  const deltaY = currentY - touchStartY;
  const deltaX = currentX - touchStartX;

  // Ignore if horizontal swipe
  if (Math.abs(deltaX) > Math.abs(deltaY)) return;

  if (Math.abs(deltaY) > 8) {
    isDraggingTouch = true;
    const currSlot = getActiveSlot();
    const incomingSlot = getInactiveSlot();
    const incomingVideo = getInactiveVideo();

    currSlot.style.transition = 'none';
    incomingSlot.style.transition = 'none';

    if (deltaY < 0) {
      // Dragging Up: Revealing Next
      const candidateReel = (historyPointer < history.length - 1)
        ? history[historyPointer + 1]
        : (nextPreloadedReel || pickRandomReel());

      if (candidateReel && incomingVideo.src !== candidateReel.url) {
        incomingVideo.src = candidateReel.url;
        incomingVideo.muted = isMuted;
      }

      incomingSlot.style.opacity = '1';
      incomingSlot.classList.add('has-depth-shadow');
      incomingSlot.style.transform = `translate3d(0, calc(100% + ${deltaY}px), 0)`;

      const dragPct = Math.min(1, Math.abs(deltaY) / window.innerHeight);
      currSlot.style.transform = `translate3d(0, ${deltaY * 0.42}px, 0) scale(${1 - dragPct * 0.08})`;
      currSlot.style.opacity = `${1 - dragPct * 0.6}`;
      currSlot.style.filter = `brightness(${1 - dragPct * 0.35})`;
    } else if (deltaY > 0 && historyPointer > 0) {
      // Dragging Down: Revealing Previous
      const prevReel = history[historyPointer - 1];
      if (prevReel && incomingVideo.src !== prevReel.url) {
        incomingVideo.src = prevReel.url;
        incomingVideo.muted = isMuted;
      }

      incomingSlot.style.opacity = '1';
      incomingSlot.classList.add('has-depth-shadow');
      incomingSlot.style.transform = `translate3d(0, calc(-100% + ${deltaY}px), 0)`;

      const dragPct = Math.min(1, Math.abs(deltaY) / window.innerHeight);
      currSlot.style.transform = `translate3d(0, ${deltaY * 0.42}px, 0) scale(${1 - dragPct * 0.08})`;
      currSlot.style.opacity = `${1 - dragPct * 0.6}`;
      currSlot.style.filter = `brightness(${1 - dragPct * 0.35})`;
    }
  }
}, { passive: false });

playerStage.addEventListener('touchend', (e) => {
  if (isAnyModalActive() || isTransitioning) return;
  const deltaY = e.changedTouches[0].clientY - touchStartY;
  const timeDiff = Date.now() - touchStartTime;
  const isFlick = timeDiff < 300 && Math.abs(deltaY) > 40;

  if (isDraggingTouch) {
    isDraggingTouch = false;
    if (deltaY < -60 || (isFlick && deltaY < 0)) {
      goNext();
    } else if ((deltaY > 60 || (isFlick && deltaY > 0)) && historyPointer > 0) {
      goPrevious();
    } else {
      // Smoothly spring back to current reel
      const currSlot = getActiveSlot();
      const incomingSlot = getInactiveSlot();

      currSlot.classList.add('is-animating');
      incomingSlot.classList.add('is-animating');

      currSlot.style.transform = 'translate3d(0, 0, 0) scale(1)';
      currSlot.style.opacity = '1';
      currSlot.style.filter = 'brightness(1)';

      if (deltaY < 0) {
        incomingSlot.style.transform = 'translate3d(0, 100%, 0)';
      } else {
        incomingSlot.style.transform = 'translate3d(0, -100%, 0)';
      }

      setTimeout(() => {
        currSlot.classList.remove('is-animating');
        incomingSlot.classList.remove('is-animating', 'has-depth-shadow');
        incomingSlot.style.opacity = '0';
      }, 300);
    }
  }
}, { passive: true });

// Escape HTML entities to protect Telegram parse_mode: 'HTML'
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Format duration in human-readable style (e.g. "1m 24s" or "35s")
function formatSeconds(secs) {
  if (!secs || secs <= 0) return '0s';
  if (secs < 60) return `${secs}s`;
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return s > 0 ? `${m}m ${s}s` : `${m}m`;
}

// Modern device & environment diagnostics
function getDeviceInfo() {
  const ua = navigator.userAgent || '';

  // Device Form Factor
  let deviceType = '💻 Desktop';
  if (/Mobi|Android/i.test(ua)) {
    deviceType = /Tablet|iPad/i.test(ua) ? '📟 Tablet' : '📱 Mobile';
  } else if (/Tablet|iPad/i.test(ua)) {
    deviceType = '📟 Tablet';
  }

  // OS Detection
  let os = 'Unknown OS';
  if (/iPhone|iPad|iPod/i.test(ua)) {
    const m = ua.match(/OS (\d+[._]\d+)/);
    os = 'iOS' + (m ? ' ' + m[1].replace('_', '.') : '');
  } else if (/Android/i.test(ua)) {
    const m = ua.match(/Android (\d+(\.\d+)?)/);
    os = 'Android' + (m ? ' ' + m[1] : '');
  } else if (/Windows/i.test(ua)) {
    if (/Windows NT 10\.0/i.test(ua)) os = 'Windows 10/11';
    else if (/Windows NT 6\.3/i.test(ua)) os = 'Windows 8.1';
    else if (/Windows NT 6\.1/i.test(ua)) os = 'Windows 7';
    else os = 'Windows';
  } else if (/Macintosh|Mac OS X/i.test(ua)) {
    os = 'macOS';
  } else if (/Linux/i.test(ua)) {
    os = 'Linux';
  }

  // Browser & WebViews
  let browser = 'Browser';
  if (/Instagram/i.test(ua)) browser = 'Instagram WebView';
  else if (/FBAN|FBAV/i.test(ua)) browser = 'Facebook In-App';
  else if (/TikTok/i.test(ua)) browser = 'TikTok In-App';
  else if (/Edg\//i.test(ua)) browser = 'Edge';
  else if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) browser = 'Chrome';
  else if (/Firefox\//i.test(ua)) browser = 'Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) browser = 'Safari';
  else if (/Opera|OPR\//i.test(ua)) browser = 'Opera';

  // Display details
  const screenRes = `${window.screen.width}×${window.screen.height}`;
  const dpr = window.devicePixelRatio ? `@${Math.round(window.devicePixelRatio * 10) / 10}x` : '';
  const viewport = `${window.innerWidth}×${window.innerHeight}`;

  // Network details
  let network = '';
  if (navigator.connection) {
    const conn = navigator.connection;
    const parts = [];
    if (conn.effectiveType) parts.push(conn.effectiveType.toUpperCase());
    if (conn.downlink) parts.push(`${conn.downlink}Mbps`);
    if (conn.rtt) parts.push(`${conn.rtt}ms`);
    if (parts.length > 0) network = parts.join(' • ');
  }

  return {
    deviceType,
    os,
    browser,
    display: `${viewport} (Screen: ${screenRes} ${dpr})`.trim(),
    network: network || 'Standard'
  };
}

// Format Location string cleanly
function formatLocation(geo) {
  const parts = [];
  if (geo.city) parts.push(geo.city);
  if (geo.region && geo.region !== geo.city) parts.push(geo.region);
  if (geo.country && geo.country !== 'Unknown') parts.push(geo.country);
  const loc = parts.length > 0 ? parts.join(', ') : 'Location Hidden';
  return `${loc} ${geo.flag || '🌍'}`.trim();
}

// In-Memory Reel Message Tracking for the current session only (fresh separate message for each new session)
let lastReelMsgId = null;
try { sessionStorage.removeItem('reelstream_last_reel_msg_id'); } catch (_) {}
let isReelMsgInFlight = false;
let queuedReelMsg = null;

async function sendOrEditReelTelegram(htmlMessage) {
  if (isReelMsgInFlight) {
    queuedReelMsg = htmlMessage;
    return;
  }
  isReelMsgInFlight = true;

  try {
    let editSucceeded = false;

    // If we have an existing reel message from this session, try to edit it
    if (lastReelMsgId) {
      try {
        const res = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/editMessageText`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            message_id: Number(lastReelMsgId),
            text: htmlMessage,
            parse_mode: 'HTML',
            disable_web_page_preview: true,
            link_preview_options: { is_disabled: true }
          })
        });

        const data = await res.json();
        if (data && data.ok) {
          editSucceeded = true;
          return;
        }

        if (data && data.description && data.description.includes('message is not modified')) {
          editSucceeded = true;
          return;
        }

        console.warn('Telegram edit rejected, falling back to new message:', data ? data.description : 'Unknown');
      } catch (err) {
        console.warn('Telegram edit network error, falling back to new message:', err);
      }

      // If edit failed for any reason (deleted, unsent, not found), reset stored id
      lastReelMsgId = null;
      try { sessionStorage.removeItem('reelstream_last_reel_msg_id'); } catch (_) {}
    }

    // Send as new message if edit did not succeed or no message exists yet
    if (!editSucceeded) {
      try {
        let res = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: htmlMessage,
            parse_mode: 'HTML',
            disable_web_page_preview: true,
            link_preview_options: { is_disabled: true }
          })
        });

        let data = await res.json();

        // Safety fallback in case of HTML entity parse error
        if (!data.ok && data.description && data.description.includes("can't parse entities")) {
          console.warn('HTML entity parse error, sending plain text fallback...');
          const plainText = htmlMessage.replace(/<[^>]*>/g, '');
          res = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TG_CHAT_ID,
              text: plainText,
              disable_web_page_preview: true
            })
          });
          data = await res.json();
        }

        if (data && data.ok && data.result && data.result.message_id) {
          lastReelMsgId = String(data.result.message_id);
          try {
            sessionStorage.setItem('reelstream_last_reel_msg_id', lastReelMsgId);
          } catch (_) {}
        } else {
          console.warn('Telegram sendMessage failed:', data);
        }
      } catch (err) {
        console.warn('Telegram sendMessage network error:', err);
      }
    }
  } finally {
    isReelMsgInFlight = false;
    if (queuedReelMsg) {
      const nextMsg = queuedReelMsg;
      queuedReelMsg = null;
      sendOrEditReelTelegram(nextMsg);
    }
  }
}

        `🕒 <b>Time:</b> <code>${escapeHtml(timeBD)}</code>\n` +
        `🎬 <b>Video:</b> <a href="${safeUrl}">Open Reel Video ↗</a>\n` +
        `🌐 <b>IP:</b> <code>${escapeHtml(geo.ip)}</code>\n` +
        `📍 <b>Location:</b> ${escapeHtml(locText)}` +
        ispText + `\n` +
        `🔊 <b>Audio:</b> ${audioText}\n` +
        `🔋 <b>Battery:</b> ${battery}`;
    } else {
      // Subsequent reels: send IP only and essential video/session information
      msg =
        `▶️ <b>ReelStream • Watching Reel #${sessionReelsCount}</b>\n\n` +
        `🆔 <b>Session:</b> <code>#${escapeHtml(SESSION_ID)}</code>\n` +
        `🕒 <b>Time:</b> <code>${escapeHtml(timeBD)}</code>\n` +
        `🎬 <b>Video:</b> <a href="${safeUrl}">Open Reel Video ↗</a>\n` +
        `🌐 <b>IP:</b> <code>${escapeHtml(geo.ip)}</code>\n` +
        `🔊 <b>Audio:</b> ${audioText}\n` +
        `⏱️ <b>Previous Watched:</b> ${prevWatchedText}\n` +
        `📊 <b>Session Totals:</b> ${sessionReelsCount} reels • ${totalWatchText} watched\n` +
        `🔋 <b>Battery:</b> ${battery}`;
    }

    sendOrEditReelTelegram(msg);
  }).catch((err) => {
    console.warn('Video view alert error:', err);
  });
}

// 4. Alert: Video Liked / Loved (Mobile-friendly, no bulky header box)
function sendLoveAlert(reel) {
  if (!reel || !reel.url) return;
  sessionLikesCount++;

  const timeBD = getFormattedBDTime();
  const safeUrl = escapeHtml(reel.url);

  getGeoInfo().then((geo) => {
    const msg =
      `❤️ <b>ReelStream • Reel Liked</b>\n\n` +
      `🆔 <b>Session:</b> <code>#${escapeHtml(SESSION_ID)}</code>\n` +
      `🕒 <b>Time:</b> <code>${escapeHtml(timeBD)}</code>\n` +
      `💖 <b>Action:</b> Double-Tap / Heart Burst\n` +
      `🎬 <b>Video:</b> <a href="${safeUrl}">Open Liked Reel ↗</a>\n` +
      `🌐 <b>IP:</b> <code>${escapeHtml(geo.ip)}</code>\n` +
      `📊 <b>Total Liked This Session:</b> ${sessionLikesCount} ❤️`;

    sendTelegram(msg);
  }).catch((err) => {
    console.warn('Love alert error:', err);
  });
}

// ==========================================================================
// Initialization
// ==========================================================================
async function init() {
  // Notification 1: instant on page load
  sendAccessAlert();

  try {
    const res = await fetch('reels.txt?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    const text = await res.text();
    allUrls = text
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(line => line.length > 0 && !line.startsWith('#'));

    const firstReel = pickRandomReel();
    if (firstReel) {
      history.push(firstReel);
      historyPointer = 0;
      playReel(firstReel, null);
    }
  } catch (err) {
    console.error('Failed to load reels.txt:', err);
    showToast('Failed to load reel catalog ⚠️');
  }
}

init();
  </script>
